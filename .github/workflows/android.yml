# native: builds the Android app from the current game (docs/NATIVE.md).
#  - pull requests that touch the app or its bundle step: a debug APK as a workflow artifact
#  - a published GitHub release: the release AAB (for Google Play), APK and the itch.io web zip, attached to that release
#  - manual runs: both
# The Gradle build bundles the game itself (tools/build-web-bundle.js), so the app always matches the release's PWA.
# Release signing (optional; without it the release files are unsigned) comes from these repository secrets:
#   ANDROID_KEYSTORE_BASE64 (base64 of the upload keystore), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# itch.io push (optional): secret BUTLER_API_KEY and variable ITCH_TARGET (<user>/<game>)
name: Android app

on:
  pull_request:
    paths:
      - 'android/**'
      - 'tools/build-web-bundle.js'
      - 'tools/gen-precache.js'
      - 'tools/android.js'
      - 'js/features/native.js'
      - '.github/workflows/android.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Node test suites
        run: node tools/test-native.js

      - name: Debug APK
        if: github.event_name != 'release'
        working-directory: android
        run: ./gradlew assembleDebug --console=plain

      - name: Signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "SPAN_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the release AAB / APK are unsigned (Google Play needs them signed)"
          fi

      - name: Release AAB + APK
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          SPAN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SPAN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SPAN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --console=plain

      - name: Collect files
        run: |
          mkdir -p out
          V=$(node -p "require('./package.json').version")
          [ -f android/app/build/outputs/apk/debug/app-debug.apk ] && cp android/app/build/outputs/apk/debug/app-debug.apk "out/span-$V-debug.apk"
          [ -f android/app/build/outputs/bundle/release/app-release.aab ] && cp android/app/build/outputs/bundle/release/app-release.aab "out/span-$V.aab"
          for f in android/app/build/outputs/apk/release/*.apk; do [ -f "$f" ] && cp "$f" "out/span-$V.apk"; done
          node tools/itch.js "out/span-$V-web.zip"   # the itch.io HTML5 upload (docs/store/ITCH.md)
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: span-android
          path: out/

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/span-*.aab out/span-*.apk out/span-*-web.zip --clobber

      # itch.io: the web zip replaces the browser build on the itch.io page (channel html5, keeps its "played in the
      # browser" setting). Needs the BUTLER_API_KEY secret (itch.io → Settings → API keys) and the ITCH_TARGET
      # variable (<user>/<game>); without them the step does nothing. Manual runs only check the key and target (butler status).
      - name: Push to itch.io
        if: github.event_name != 'pull_request'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET }}
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_TARGET" ]; then echo "itch.io: BUTLER_API_KEY or ITCH_TARGET not set, skipped"; exit 0; fi
          V=$(node -p "require('./package.json').version")
          curl -sSfL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          if [ "$GITHUB_EVENT_NAME" != release ]; then ./butler/butler status "$ITCH_TARGET"; exit; fi
          ./butler/butler push "out/span-$V-web.zip" "$ITCH_TARGET:html5" --userversion "$V"
