<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPAN: Privacy policy</title>
  <!-- SPAN's privacy policy is umage.ai Studio's shared policy for all its games. This address was the first store
       listing's privacy URL, so it stays and forwards there (Danish browsers or ?lang=da to the Danish page). -->
  <meta http-equiv="refresh" content="0; url=https://studio.umage.ai/privacy/">
  <link rel="canonical" href="https://studio.umage.ai/privacy/">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d1424">
  <script>
    (function () {
      var da = /[?&]lang=da\b/.test(location.search) ||
        (!/[?&]lang=/.test(location.search) && /^da\b/i.test(navigator.language || ''));
      location.replace(da ? 'https://studio.umage.ai/da/privatliv/' : 'https://studio.umage.ai/privacy/');
    })();
  </script>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #0d1424; color: #e8ecf6; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 40px 16px; }
    a { color: #ffb547; }
  </style>
</head>
<body>
  <main>
    <p>SPAN's privacy policy is the umage.ai Studio privacy policy:
      <a href="https://studio.umage.ai/privacy/">studio.umage.ai/privacy</a></p>
    <p lang="da">SPANs privatlivspolitik er umage.ai Studios privatlivspolitik:
      <a href="https://studio.umage.ai/da/privatliv/">studio.umage.ai/da/privatliv</a></p>
  </main>
</body>
</html>
