<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- SPAN jungle anchor: three hardwood posts lashed with rope, an iron ring bolt.
       The anchor POINT (bolt centre) is at (64, 28), as in anchor.svg; the posts hang below it. -->
  <defs>
    <linearGradient id="aw_log" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3a1e"/><stop offset="0.45" stop-color="#9a6a3a"/><stop offset="1" stop-color="#4a2e16"/>
    </linearGradient>
    <radialGradient id="aw_pin" cx="60" cy="24" r="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d8d0c0"/><stop offset="0.5" stop-color="#8a7a66"/><stop offset="1" stop-color="#3a3028"/>
    </radialGradient>
  </defs>
  <g stroke="#1c2230" stroke-width="3" stroke-linejoin="round">
    <path d="M14 34 Q22 26 38 32 L40 124 Q26 128 12 124 Z" fill="url(#aw_log)"/>
    <path d="M88 32 Q104 26 116 34 L116 124 Q102 128 88 124 Z" fill="url(#aw_log)"/>
    <path d="M44 30 Q64 22 84 30 L86 126 Q64 130 42 126 Z" fill="url(#aw_log)"/>
    <ellipse cx="26" cy="33" rx="12" ry="4" fill="#c89a62"/>
    <ellipse cx="102" cy="33" rx="13" ry="4" fill="#c89a62"/>
  </g>
  <g fill="none" stroke="#5a3a1e" stroke-width="1.6" opacity="0.6">
    <path d="M22 50 v60 M32 60 v50 M56 50 v66 M72 44 v70 M96 56 v56 M108 48 v60"/>
  </g>
  <!-- rope lashings -->
  <g stroke="#1c2230" stroke-width="2" fill="#d9c08a">
    <path d="M10 58 Q64 50 118 58 L118 66 Q64 58 10 66 Z"/>
    <path d="M10 96 Q64 88 118 96 L118 104 Q64 96 10 104 Z"/>
  </g>
  <g stroke="#a88a50" stroke-width="1.4"><path d="M20 58 l4 8 M36 56 l4 8 M52 55 l4 8 M68 55 l4 8 M84 55 l4 8 M100 57 l4 8 M20 96 l4 8 M36 94 l4 8 M52 93 l4 8 M68 93 l4 8 M84 93 l4 8 M100 95 l4 8"/></g>
  <!-- moss -->
  <path d="M14 120 Q24 110 34 118 Q44 112 52 122 L52 126 L14 126 Z" fill="#4f8a3a" opacity="0.85"/>
  <!-- iron ring bolt -->
  <circle cx="64" cy="28" r="15" fill="#1c2230"/>
  <circle cx="64" cy="28" r="12" fill="url(#aw_pin)"/>
  <circle cx="64" cy="28" r="4.5" fill="#3a3028"/>
</svg>
