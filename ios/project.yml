# XcodeGen spec for the SPAN iOS app (https://github.com/yonaskolb/XcodeGen).
# Generate the project with:   cd ios && xcodegen generate     (creates ios/SPAN.xcodeproj, which is gitignored)
# The game is NOT in this folder: SPAN/www is generated by `node tools/build-web-bundle.js ios/SPAN/www --platform ios`
# (npm run ios:bundle) and added to the app as a folder reference, so the app ships the current PWA files.
# Versions: MARKETING_VERSION and CURRENT_PROJECT_VERSION are placeholders here; CI overrides them on the
# xcodebuild command line from package.json (same rule as Android: major*10000 + minor*100 + patch).
name: SPAN

options:
  bundleIdPrefix: ai.umage
  deploymentTarget:
    iOS: "15.0"

targets:
  SPAN:
    type: application
    platform: iOS
    sources:
      - path: SPAN/Sources
      - path: SPAN/Assets.xcassets
      - path: SPAN/www
        type: folder
        buildPhase: resources
    info:
      path: SPAN/Info.plist
      properties:
        CFBundleDisplayName: SPAN
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.umage.span
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "$(SPAN_TEAM_ID)"
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
